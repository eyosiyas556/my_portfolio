<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242625" />
      <stop offset="100%" stop-color="#141514" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4f4d" />
      <stop offset="100%" stop-color="#2a2d2c" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>
  
  <!-- "E" Initial Letter -->
  <text x="27" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="42" fill="#ffffff" text-anchor="middle">E</text>
  
  <!-- Signature Brand Dot "." -->
  <circle cx="47" cy="44.5" r="4.5" fill="#f4f4f5"/>
</svg>